<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAPK - AI Website to APK Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">
    <div class="max-w-4xl mx-auto px-4 py-12 w-full">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400">ZAPK</h1>
            <p class="text-slate-400 mt-2">Convert any website into a powerful Android App instantly using AI.</p>
        </header>

        <main class="bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700">
            <form action="process.php" method="POST" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Website URL</label>
                    <input type="url" name="site_url" required placeholder="https://example.com" 
                           class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">App Name</label>
                        <input type="text" name="app_name" required placeholder="My Business App" 
                               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Package Name (ID)</label>
                        <input type="text" name="package_name" required placeholder="com.business.app" 
                               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Upload App Logo (PNG)</label>
                    <input type="file" name="app_logo" accept="image/png" 
                           class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
                </div>

                <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
                    Generate ZAPK Package
                </button>
            </form>
        </main>
    </div>
    
    <footer class="text-center py-6 text-slate-500 text-sm">
        &copy; 2026 ZAPK. Built for fast mobile deployment.
    </footer>
</body>
</html>
